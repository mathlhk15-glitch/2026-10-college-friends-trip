mages":["photos/110.jpg","photos/111.jpg","photos/124.jpg"],"chapter":"다시 호숫가"},{"kind":"scene","title":"함께 걷는 풍경","kicker":"앞서가기도, 기다리기도","caption":"속도는 달라도 목적지는 같다.","images":["photos/118.jpg","photos/130.jpg","photos/131.jpg"],"chapter":"다시 호숫가"},{"kind":"scene","title":"오늘의 베스트 팀","kicker":"웃음은 사람이 만든다","caption":"모이면 언제나 단체사진부터!","images":["photos/126.jpg","photos/127.jpg","photos/128.jpg"],"chapter":"다시 호숫가"},{"kind":"scene","title":"장난은 아직도 현역","kicker":"사진 속엔 늘 청춘이 있다","caption":"정말 변하지 않은 건 이 표정들.","images":["photos/125.jpg","photos/162.jpg","photos/176.jpg"],"chapter":"다시 호숫가"},{"kind":"scene","title":"우리가 같이 본 풍경","kicker":"호수와 하늘, 그리고 친구","caption":"올가을 가장 잘한 일: 함께 떠난 것.","images":["photos/133.jpg","photos/159.jpg","photos/174.jpg"],"chapter":"다시 호숫가"},{"kind":"scene","title":"여행의 선물","kicker":"휴대폰에 남은 건 사진뿐일까?","caption":"아니, 돌아가는 길에도 이어지는 이야기.","images":["photos/143.jpg","photos/144.jpg","photos/189.jpg"],"chapter":"추억"},{"kind":"scene","title":"아침 해처럼 오래","kicker":"새벽의 빛처럼 오래 남기를","caption":"우리의 시간은 계속 쌓여간다.","images":["photos/190.jpg","photos/191.jpg","photos/192.jpg"],"chapter":"추억"},{"kind":"scene","title":"카메라를 들자마자","kicker":"단체사진엔 늘 한 명의 감독이 있다","caption":"'조금만 더 붙어!' 오늘도 촬영 감독은 바쁘다.","images":["photos/196.jpg","photos/198.jpg","photos/203.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"가을 산책, 수다는 무제한","kicker":"발은 천천히, 이야기는 속사포","caption":"길은 멀어도 학창 시절 이야기는 끝이 없다.","images":["photos/213.jpg","photos/215.jpg","photos/218.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"그늘 아래 수다 한 상","kicker":"맛있는 음식보다 더 맛있는 옛날 이야기","caption":"누가 먼저 웃었는지 모를 만큼 웃었던 시간.","images":["photos/217.jpg","photos/222.jpg","photos/224.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"오늘의 포토존은 여기","kicker":"하늘은 파랗고, 표정은 더 밝고","caption":"우리끼리는 포즈도 정답이 없다!","images":["photos/236.jpg","photos/245.jpg","photos/251.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"단체사진은 계속된다","kicker":"첫 번째가 마지막일 리 없지","caption":"한 컷 더! 한 번 더! 그래도 찍어두길 잘했다.","images":["photos/252.jpg","photos/257.jpg","photos/261.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"테이블마다 웃음꽃","kicker":"이야기가 끊기지 않는 우리의 식탁","caption":"만나면 배도 마음도 든든해진다.","images":["photos/273.jpg","photos/275.jpg","photos/276.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"오래된 공간, 새로운 사진","kicker":"불국사에서 함께 남긴 또 한 페이지","caption":"시간은 흘러도 옆에 설 친구가 있다는 선물.","images":["photos/280.jpg","photos/283.jpg","photos/288.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"마지막까지 사진 한 장","kicker":"집에 가기 전에 한 컷만 더","caption":"오늘의 사진은 내일의 추억. 다음 만남도 벌써 기다려진다.","images":["photos/290.jpg","photos/292.jpg","photos/294.jpg"],"chapter":"새로운 추억"},{"kind":"scene","title":"바람보다 신난 우리","kicker":"풍력발전기 아래에서","caption":"바람개비는 천천히 돌아도 우리 장난기는 여전히 쌩쌩! 손을 흔들고, 포즈를 잡고, 추억 한 장 더.","images":["photos/295.jpg","photos/296.jpg"],"chapter":"바람과 웃음"},{"kind":"outro","title":"다음에도 또 만나자","kicker":"같이여서 좋았던 1박 2일","caption":"세월은 더해도, 우리의 웃음은 그대로. 다음 여행에서 또 보자!","images":["photos/161.jpg"],"chapter":"마지막 인사"}];const slides=SLIDES;let idx=0,timer=null,startX=null;const $=id=>document.getElementById(id);const img=(s,one=false)=>`<div class="photo ${one?'landscape':''}"><img src="${s}" loading="eager" alt="여행 사진" onerror="this.classList.add('error')"></div>`;function render(){let s=slides[idx];$('show').innerHTML=`<div class="bg" style="background-image:url('${s.images[0]}')"></div><div class="shade"></div><div class="counter">${idx+1} / ${slides.length}</div><article class="slide ${s.kind}"><div class="chapter">${s.chapter} · 2026 AUTUMN</div><h1 class="h1">${s.title}</h1><div class="kicker">${s.kicker}</div><div class="collage">${s.images.map(x=>img(x,s.images.length===1)).join('')}</div><div class="caption">${s.caption}</div></article>`;$('fill').style.width=`${100*(idx+1)/slides.length}%`;$('count').textContent=`${idx+1} / ${slides.length}`;$('prev').disabled=idx===0;$('next').textContent=idx===slides.length-1?'다시 보기 ↻':'다음 ❯';history.replaceState(null,'','#slide-'+(idx+1))}function go(n){idx=(n+slides.length)%slides.length;render()}function stop(){clearInterval(timer);timer=null;$('auto').textContent='▶ 자동재생'}function toggle(){if(timer){stop()}else{timer=setInterval(()=>go(idx+1),5500);$('auto').textContent='Ⅱ 일시정지'}}$('prev').onclick=()=>{stop();go(Math.max(0,idx-1))};$('next').onclick=()=>{stop();go(idx+1)};$('auto').onclick=toggle;document.addEventListener('keydown',e=>{if($('lightbox').classList.contains('open')){if(e.key==='Escape')$('lightbox').classList.remove('open');return}if($('overlay').classList.contains('open')){if(e.key==='Escape')$('overlay').classList.remove('open');return}if(e.key==='ArrowRight'||e.key===' '){stop();go(idx+1)}if(e.key==='ArrowLeft'){stop();go(Math.max(0,idx-1))}});$('show').addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});$('show').addEventListener('touchend',e=>{if(startX===null)return;let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>55){stop();go(Math.max(0,Math.min(slides.length-1,idx+(d<0?1:-1))))}startX=null},{passive:true});function openOverlay(content){stop();$('overlay').classList.add('open');$('overlayBody').innerHTML=content};$('close').onclick=()=>$('overlay').classList.remove('open');$('chapters').onclick=()=>openOverlay(`<div class="toc">${slides.map((s,i)=>`<button data-slide="${i}"><small>${String(i+1).padStart(2,'0')} / ${s.chapter}</small><b>${s.title}</b><span>${s.kicker}</span></button>`).join('')}</div>`);$('allphotos').onclick=()=>openOverlay(`<div class="dlbar"><p class="hint">전체 296장 · 사진을 선택하거나 눌러 확대하세요.</p><div class="dlbuttons"><button class="btn" id="toggleSelect">☑ 선택 모드</button><button class="btn" id="selectAll">전체 선택</button><button class="btn" id="selectClear">선택 해제</button><button class="btn primary" id="downloadSelected">선택 다운로드 (0)</button><button class="btn" id="downloadAll">전체 다운로드</button></div><p class="hint" id="dlStatus" aria-live="polite">ZIP 다운로드는 휴대폰 저장 공간이 충분할 때 이용하세요. 전체 다운로드는 용량을 고려해 50장씩 ZIP으로 나눕니다.</p></div><div class="tiles">${Array.from({length:296},(_,i)=>`<button data-photo="${i+1}"><img loading="lazy" src="photos/${String(i+1).padStart(3,'0')}.jpg" alt="여행 사진 ${i+1}" onerror="this.style.opacity=.15"><span>${String(i+1).padStart(3,'0')}</span></button>`).join('')}</div>`);$('videoBtn').onclick=()=>openOverlay(`<div class="video"><h2>우리 여행의 영상 기록</h2><p class="hint">재생 버튼을 눌러 감상하세요. 소리는 직접 켤 수 있습니다.</p><video controls playsinline preload="metadata" src="여행영상.mp4"></video></div>`);$('overlayBody').addEventListener('click',e=>{let a=e.target.closest('[data-slide]');if(a){$('overlay').classList.remove('open');go(Number(a.dataset.slide))}let p=e.target.closest('[data-photo]');if(p){let n=p.dataset.photo;if(selectMode){const v=Number(n);if(selected.has(v))selected.delete(v);else selected.add(v);p.classList.toggle("picked",selected.has(v));refreshSel();return;}$('large').src=`photos/${String(n).padStart(3,'0')}.jpg`;$('lightbox').classList.add('open');$('largeNum').textContent=`사진 ${n} / 296`;window.currentPhoto=Number(n)}});$('lightclose').onclick=()=>$('lightbox').classList.remove('open');const hash=Number(location.hash.replace('#slide-',''));if(hash>=1&&hash<=slides.length)idx=hash-1;render();
let selectMode=false;const selected=new Set();let busy=false;
function refreshSel(){const b=$('downloadSelected');if(b)b.textContent=`선택 다운로드 (${selected.size})`;const b2=$('toggleSelect');if(b2)b2.textContent=selectMode?'☑ 선택 중':'☑ 선택 모드';}
function photoPath(n){return `photos/${String(n).padStart(3,'0')}.jpg`}
function setStatus(t){const el=$('dlStatus');if(el)el.textContent=t}
// Self-contained ZIP writer (store mode), with UTF-8 filenames. Does not rely on external CDN.
const crcTable=(()=>{let a=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);a[n]=c>>>0;}return a;})();
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function makeZip(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;for(let f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);let head=new Uint8Array(30+name.length),dv=new DataView(head.buffer);dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(8,0,true);dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);dv.setUint16(26,name.length,true);head.set(name,30);chunks.push(head,data);let cen=new Uint8Array(46+name.length),cv=new DataView(cen.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);cen.set(name,46);central.push(cen);offset+=head.length+data.length;}const dirSize=central.reduce((a,b)=>a+b.length,0);chunks.push(...central);let end=new Uint8Array(22),dv=new DataView(end.buffer);dv.setUint32(0,0x06054b50,true);dv.setUint16(8,files.length,true);dv.setUint16(10,files.length,true);dv.setUint32(12,dirSize,true);dv.setUint32(16,offset,true);chunks.push(end);return new Blob(chunks,{type:'application/zip'})}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function downloadNumbers(numbers,isAll=false){if(busy)return;busy=true;try{let groups=[];for(let i=0;i<numbers.length;i+=50)groups.push(numbers.slice(i,i+50));for(let i=0;i<groups.length;i++){const a=[];for(let j=0;j<groups[i].length;j++){const n=groups[i][j];setStatus(`사진 다운로드 준비 중: ${i+1}/${groups.length}묶음 · ${j+1}/${groups[i].length}장`);const response=await fetch(photoPath(n));if(!response.ok)throw Error(`${n}번 사진 없음 (${response.status})`);a.push({name:`travel_${String(n).padStart(3,'0')}.jpg`,data:new Uint8Array(await response.arrayBuffer())});}let blob=makeZip(a);saveBlob(blob,`${isAll?'대학동기_전체사진':'대학동기_선택사진'}_${i+1}of${groups.length}.zip`);setStatus(`${i+1}/${groups.length}묶음 다운로드 시작. 저장 안내가 나오면 승인한 후 다음 파일을 확인하세요.`);if(groups.length>1)await new Promise(r=>setTimeout(r,800));}}catch(e){setStatus('다운로드 실패: '+e.message)}finally{busy=false}}
$('singleDownload').onclick=async()=>{let n=window.currentPhoto;if(!n)return;const response=await fetch(photoPath(n));if(!response.ok){alert('사진을 찾지 못했습니다.');return}saveBlob(await response.blob(),`대학동기_${String(n).padStart(3,'0')}.jpg`)};
$('overlayBody').addEventListener('click',e=>{if(e.target.id==='toggleSelect'){selectMode=!selectMode;refreshSel()}if(e.target.id==='selectAll'){selectMode=true;for(let n=1;n<=296;n++)selected.add(n);$('overlayBody').querySelectorAll('[data-photo]').forEach(t=>t.classList.add('picked'));refreshSel()}if(e.target.id==='selectClear'){selected.clear();$('overlayBody').querySelectorAll('[data-photo]').forEach(t=>t.classList.remove('picked'));refreshSel()}if(e.target.id==='downloadSelected'){if(!selected.size){setStatus('다운로드할 사진을 먼저 선택해 주세요.');return}downloadNumbers([...selected].sort((a,b)=>a-b))}if(e.target.id==='downloadAll'){if(confirm('전체 사진 296장을 50장씩 여러 ZIP 파일로 다운로드할까요?'))downloadNumbers(Array.from({length:296},(_,i)=>i+1),true)}});
</script></body></html>
